services:
  web:
    build: .
    image: continuous-price-web:latest
    container_name: continuous-price-web
    ports:
      - "8000:8000"
    volumes:
      # SQLite 数据库（含 WAL 文件）持久化到宿主机，重建容器不丢数据
      - ./data:/data
    environment:
      CONT_DB_PATH: /data/continuous.db
      CONT_SECRET_KEY: change-me-in-production
    restart: unless-stopped

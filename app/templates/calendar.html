{% extends "base.html" %}
{% block title %}交易日历{% endblock %}
{% block content %}
<h2>交易日历</h2>
<p class="hint">每行一个交易日（YYYY-MM-DD），保存时全量替换、自动去重排序。保存规则：
换月切换日必须保留在日历内，且每个切换日都要有前一交易日；已有报价的交易日不能删除；
保存后系统按新日历重新锚定各次换月的价差参考日（切换日前最近的交易日），
只重算参考日有变化的换月，日历、参考日、价差与索引在同一事务内原子生效。</p>
<form method="post">
  <textarea name="dates" rows="16" placeholder="2026-01-05&#10;2026-01-06&#10;...">{{ dates }}</textarea>
  <div><button type="submit">保存交易日历</button></div>
</form>
{% endblock %}
